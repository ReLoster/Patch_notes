<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patch_notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="app" class="hidden">

    <header class="topbar">
      <button id="sidebar-toggle" class="link-btn" style="font-size: 20px; padding: 0 10px 0 0; color: var(--purple);">☰</button>
      <div class="topbar-logo"><span>Patch_notes</span></div>
      
      <div class="search-box">
        <span class="search-icon"></span>
        <input type="text" id="search-input" placeholder="Поиск заметок">
      </div>
      
      <div class="topbar-right">
        <span id="user-name"></span>
        <button id="logout-btn" class="logout-btn">Выйти</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="sidebar">
        <button class="nav-btn active" data-view="notes"><span>Заметки</span></button>
        <button class="nav-btn" data-view="trash"><span>Корзина</span></button>
        
        <div class="folders-section">
          <div class="folders-header">
            <span>Папки</span>
            <button id="add-folder-btn" class="link-btn" title="Новая папка">+</button>
          </div>
          <div id="folders-list"></div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <h2 id="view-title">Заметки</h2>
          <div class="content-actions">

            <div class="custom-select" id="sort-dropdown">
              <div class="custom-select-trigger" id="sort-trigger">
                <span id="sort-label">По порядку</span>
                <span class="arrow">▼</span>
              </div>
              <div class="custom-select-options hidden" id="sort-options">
                <div data-value="custom">По порядку</div>
                <div data-value="updated-desc">Сначала изменённые</div>
                <div data-value="updated-asc">Сначала старые (изменение)</div>
                <div data-value="created-desc">Сначала новые</div>
                <div data-value="created-asc">Сначала старые</div>
                <div data-value="title-asc">По названию (А–Я)</div>
                <div data-value="title-desc">По названию (Я–А)</div>
              </div>
            </div>

            <button id="new-note-btn">＋ Создать заметку</button>
          </div>
        </div>
        <div id="notes-grid"></div>
        <p id="empty-msg"></p>
      </main>
    </div>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <span>2026 Patch_notes</span>
        <span class="sep">·</span>
        <span>Приватный сервис для ваших заметок</span>
      </div>
    </footer>

    <div id="editor-overlay" class="hidden">
      <div class="editor">
        <input type="text" id="note-title" placeholder="Заголовок">
        <textarea id="note-text" placeholder="Заметка..." rows="8"></textarea>
        <p id="editor-meta"></p>
        <div class="editor-buttons">
          <button id="editor-delete" class="red-btn"></button>
          <button id="editor-restore" class="hidden"></button>
          <span class="spacer"></span>
          <button id="editor-cancel">Отмена</button>
          <button id="editor-save" class="blue-btn">Сохранить</button>
        </div>
      </div>
    </div>

    <div id="folder-overlay" class="hidden">
      <div class="editor" style="max-width: 400px;">
        <h3 style="margin-bottom: 10px; font-weight: 500;">Новая папка</h3>
        <input type="text" id="folder-name-input" placeholder="Название папки...">
        <div class="editor-buttons">
          <span class="spacer"></span>
          <button id="folder-cancel">Отмена</button>
          <button id="folder-save" class="blue-btn">Создать</button>
        </div>
      </div>
    </div>

  </div>

  <script src="bg.js"></script>
  <script src="app.js"></script>
</body>
</html>
